# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
fail_fast: true
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: debug-statements
  - id: check-yaml
  - id: check-added-large-files
- repo: local
  hooks:
    - id: lint
      name: ruff linter
      entry: ruff check
      language: system
      types: [python]

    - id: prettier
      name: ruff format - pretty code
      entry: ruff format
      files: ^mlabican/
      language: system
      types: [python]

    - id: unit-tests
      name: Unit tests w/ coverage
      entry: bash -c "coverage erase && coverage run -m unittest discover -s tests/unit/ && coverage report"
      language: system
      pass_filenames: false
      always_run: true
      verbose: true
      stages: [pre-commit]
