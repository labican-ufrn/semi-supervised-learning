# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: debug-statements
  - id: check-yaml
  - id: check-added-large-files
- repo: local
  hooks:
    - id: unit-tests
      name: Unit tests
      entry: python -m unittest
      args: ['discover', 'tests']
      language: system
      pass_filenames: false
      verbose: true
    - id: isort
      name: Isort - formattion imports
      entry: isort
      language: python
      types: [python]
    - id: formatter
      name: ruff
      entry: ruff format
      language: system
      types: [python]
    - id: lint
      name: ruff linter
      entry: ruff check
      language: system
      types: [python]
